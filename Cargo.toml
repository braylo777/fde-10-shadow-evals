[package]
name = "fde-10-shadow-evals"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Golden sets from real logs, trajectory grading of a shadow agent, LLM-judge calibration and business-metric comparison with confidence intervals."
repository = "https://github.com/braylo777/fde-10-shadow-evals"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "fde-10-shadow-evals"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
hmac = "=0.12.1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
